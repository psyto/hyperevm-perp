[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "hyperevm-amm/=lib/hyperevm-amm/src/",
  "hl-price-guard/=lib/hl-price-guard/src/",
]

[rpc_endpoints]
hyperevm = "https://rpc.hyperliquid.xyz/evm"
hyperevm_testnet = "https://rpc.hyperliquid-testnet.xyz/evm"
